<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>照護量能賽局 ｜ 參與護理政策工作坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#22402E; --green-dark:#182E20; --green-soft:#31513C; --green-line:#2f4c39;
  --cream:#F2EDE1; --card:#FCFAF3; --card-2:#F7F3E9;
  --gold:#B4903A; --gold-soft:#C9A75A; --gold-bg:#F0E7CF;
  --border:#DED6C1; --ink:#28281f; --muted:#7C7869;
  --coop:#2E7D4F; --hold:#B4903A; --self:#9C4B3B;
  --serif:'Noto Serif TC','Songti TC','PingFang TC','Microsoft JhengHei',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;line-height:1.6}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--green);color:#EDE9DA;display:flex;flex-direction:column;padding:22px 16px;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 18px;border-bottom:1px solid var(--green-line);margin-bottom:10px}
.logo{width:46px;height:46px;border-radius:12px;background:#FBF9F2;display:grid;place-items:center;overflow:hidden}
.logo img{width:78%;height:78%;object-fit:contain;display:block}
.brand h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;line-height:1.35;color:#F3EFE2}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav-label{font-size:12px;color:#9DB0A2;letter-spacing:2px;padding:14px 10px 6px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;color:#D9DCCF;font-size:15px;font-family:var(--sans)}
.nav button .ic{width:18px;text-align:center;opacity:.85}
.nav button:hover{background:var(--green-soft)}
.nav button.active{background:#EDE7D6;color:var(--green);font-weight:700}
.side-foot{margin-top:auto;border-top:1px solid var(--green-line);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.side-foot button{all:unset;cursor:pointer;padding:11px 12px;border-radius:10px;font-size:14px;color:#D9DCCF}
.side-foot button:hover{background:var(--green-soft)}
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 30px;border-bottom:1px solid var(--border)}
.topbar .tt h2{font-family:var(--serif);font-size:24px;margin:0;color:var(--green)}
.topbar .tt p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.content{padding:26px 30px 60px;max-width:1180px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:22px}
.card > h3{font-family:var(--serif);font-size:19px;margin:0 0 4px;color:var(--green);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.badge{background:var(--gold-bg);color:var(--gold);border:1px solid #E4D6AE;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;font-family:var(--serif)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.5px}
select,input[type=text],input[type=password]{font-family:var(--sans);font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 12px;min-width:120px}
select:focus,input:focus{outline:2px solid var(--gold-soft);outline-offset:1px}
.seg{display:inline-flex;background:var(--card-2);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{all:unset;cursor:pointer;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--green);color:#F3EFE2}
.btn{all:unset;cursor:pointer;background:var(--green);color:#F3EFE2;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:700;text-align:center}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--border)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center}
.scorebox{background:var(--green);color:#F1EEDF;border-radius:14px;padding:20px 22px}
.scorebox .lab{font-size:13px;color:#BFD0C4;letter-spacing:1px}
.scorebox .big{font-family:var(--serif);font-size:52px;font-weight:900;line-height:1;margin:6px 0 2px}
.scorebox .vs{font-size:13.5px;color:#CFC9B4}.scorebox .vs b{color:var(--gold-soft)}
.metrics{display:flex;gap:12px;flex-wrap:wrap}
.metric{flex:1;min-width:120px;background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.metric .m-lab{font-size:12px;color:var(--muted)}
.metric .m-val{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid #EBE5D5}
th{font-family:var(--serif);color:var(--green);font-weight:700;font-size:13.5px;background:var(--card-2)}
td.rd{font-weight:700;color:var(--muted)}
tr.wt td{background:#FBF4E4}
.wtag{font-size:11px;color:var(--gold);font-weight:700}
.selc{min-width:104px}
.tot td{font-weight:800;color:var(--green);background:var(--card-2);border-top:2px solid var(--border)}
.chartwrap{margin-top:10px}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--muted);margin:8px 2px 0;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.matches{display:grid;grid-template-columns:1fr;gap:22px}
.mhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.vs-names{font-family:var(--serif);font-size:18px;color:var(--green)}
.vs-names .u{color:var(--gold)}
.verdict{font-weight:700;font-size:13.5px}
.pill3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.stat .s-lab{font-size:12.5px;color:var(--muted)}
.stat .s-val{font-family:var(--serif);font-size:30px;font-weight:800;color:var(--green);line-height:1.1;margin-top:2px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.help p{margin:0 0 10px}.help code{background:var(--gold-bg);padding:2px 6px;border-radius:6px;font-size:13px}
.help h4{font-family:var(--serif);color:var(--gold);margin:18px 0 6px}
.foot-note{font-size:12px;color:var(--muted);margin-top:8px}
.login{max-width:380px;margin:6px auto 0}
.login .field{margin-bottom:14px}
.login .err{color:var(--self);font-size:13px;min-height:18px;margin:2px 0 8px}
.logout{all:unset;cursor:pointer;color:var(--muted);font-size:13px;border:1px solid var(--border);padding:6px 12px;border-radius:8px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start;margin-top:12px}
.pwbox{background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;max-width:420px}
@media(max-width:900px){ .mgrid{grid-template-columns:1fr} }
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:4px}
  .brand{border:0;margin:0 auto 0 0;padding:0 6px}.brand h1{font-size:14px}
  .nav{flex-direction:row;flex-wrap:wrap;margin:0}.nav-label{display:none}
  .nav button{padding:8px 11px;font-size:14px}
  .side-foot{display:none}
  .hero{grid-template-columns:1fr}
  .pill3{grid-template-columns:1fr}
  .content{padding:16px 12px 48px}.topbar{padding:12px 16px}
  .topbar .tt h2{font-size:20px}
  .card{padding:16px 14px;border-radius:14px}
  table{font-size:13px}.selc{min-width:92px}
  th,td{padding:8px 6px}
}
@media(max-width:560px){
  .scorebox .big{font-size:42px}
  .nav button span.ic{display:none}
  .metric{min-width:100px}
}
</style>
</head>

<script>
const MATCHES=[{key:'m1',label:'A大組'},{key:'m2',label:'B大組'},{key:'m3',label:'C大組'}];
const GROUPNUMS=[1,2,3,4,5,6];
const LEVELS=['全力共援','保留一手','優先自保'];
const LHEX={'全力共援':'#2E7D4F','保留一手':'#B4903A','優先自保':'#9C4B3B'};
const WEIGHTS=[1,1,1,2,1,1,1,3];
const PAY={
 '全力共援|全力共援':[11,11],'全力共援|保留一手':[2,18],'全力共援|優先自保':[2,15],
 '保留一手|全力共援':[18,2],'保留一手|保留一手':[8,8],'保留一手|優先自保':[3,15],
 '優先自保|全力共援':[15,2],'優先自保|保留一手':[15,3],'優先自保|優先自保':[5,5]};
const COOP_MAX=121, JOINT_MAX=242;
const KEY='twt_trustgame_v2';
const glabel=v=>v?('第'+v+'組'):'';
const USERNAME='admin';
const DEFAULT_HASH='03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4'; // sha256('1234')
function getHash(){try{return localStorage.getItem('twt_pwhash')||DEFAULT_HASH;}catch(e){return DEFAULT_HASH;}}
function sha256(ascii){function r(v,a){return(v>>>a)|(v<<(32-a));}var mp=Math.pow,mw=mp(2,32),i,j,res='',words=[],bl=ascii.length*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,comp={};for(var c=2;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0;}}ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return;words[i>>2]|=j<<((3-i)%4)*8;}words[words.length]=(bl/mw)|0;words[words.length]=bl;for(j=0;j<words.length;){var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4],t1=hash[7]+(r(e,6)^r(e,11)^r(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=i<16?w[i]:(w[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+w[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0),t2=(r(a,2)^r(a,13)^r(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0;}for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;}for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16);}return res;}
function hashpw(p){return sha256(unescape(encodeURIComponent(p)));}

function blankState(){const s={groups:{},rounds:{}};MATCHES.forEach(m=>{s.groups[m.key]={f:'',u:''};s.rounds[m.key]=Array.from({length:8},()=>({f:'',u:''}));});return s;}
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s.groups&&s.rounds)return s;}}catch(e){}return null;}
let state=load()||blankState();
let ui={view:'student',match:'m1',side:'f'};
let authed=false;try{authed=sessionStorage.getItem('twt_authed')==='1';}catch(e){}
let bc=null;try{bc=new BroadcastChannel(KEY);bc.onmessage=()=>{const s=load();if(s){state=s;renderAll();}};}catch(e){}
window.addEventListener('storage',e=>{if(e.key===KEY){const s=load();if(s){state=s;renderAll();}}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}try{bc&&bc.postMessage('u');}catch(e){}}

function computeMatch(mk){
  const rs=state.rounds[mk];let fc=0,uc=0,ftot=0,utot=0,defect=null;
  const rows=rs.map((r,i)=>{const w=WEIGHTS[i];let fp='',up='';
    if(r.f&&r.u){const p=PAY[r.f+'|'+r.u];fp=p[0];up=p[1];fc+=fp*w;uc+=up*w;ftot+=fp*w;utot+=up*w;
      if(defect===null&&!(r.f==='全力共援'&&r.u==='全力共援'))defect=i+1;}
    return{n:i+1,f:r.f,u:r.u,w,fp,up,fcum:(r.f&&r.u)?fc:'',ucum:(r.f&&r.u)?uc:''};});
  const joint=ftot+utot,ratio=joint/JOINT_MAX,played=rs.some(r=>r.f&&r.u);
  return{rows,ftot,utot,joint,ratio,defect,played};
}
function verdict(ratio,played){if(!played)return['（尚未開始）','var(--muted)'];if(ratio>=0.85)return['接近全程共好 👏','var(--coop)'];if(ratio>=0.60)return['多數回合合作','var(--green)'];if(ratio>=0.46)return['偏向僵局','var(--hold)'];return['信任崩壞，雙輸','var(--self)'];}

function lineChart(series,opts={}){
  const W=640,H=230,pad={l:38,r:14,t:14,b:26},n=8;
  let maxY=0;series.forEach(s=>s.pts.forEach(v=>{if(v!=null&&v>maxY)maxY=v;}));maxY=Math.max(20,Math.ceil(maxY/20)*20);
  const x=i=>pad.l+(W-pad.l-pad.r)*i/(n-1),y=v=>H-pad.b-(H-pad.t-pad.b)*(v/maxY);
  let g='';for(let t=0;t<=maxY;t+=maxY/4){g+=`<line x1="${pad.l}" y1="${y(t)}" x2="${W-pad.r}" y2="${y(t)}" stroke="#EBE5D5"/><text x="${pad.l-6}" y="${y(t)+4}" font-size="11" fill="#9a9683" text-anchor="end">${t}</text>`;}
  for(let i=0;i<n;i++)g+=`<text x="${x(i)}" y="${H-6}" font-size="11" fill="#9a9683" text-anchor="middle">${i+1}</text>`;
  let lines='';series.forEach(s=>{const pv=s.pts.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
    if(pv.length){lines+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" points="${pv.map(p=>p.join(',')).join(' ')}"/>`;pv.forEach(p=>lines+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${s.color}"/>`);}});
  if(opts.defect){const dx=x(opts.defect-1);lines+=`<line x1="${dx}" y1="${pad.t}" x2="${dx}" y2="${H-pad.b}" stroke="#9C4B3B" stroke-width="1.2" stroke-dasharray="4 3"/><text x="${dx+3}" y="${pad.t+11}" font-size="10.5" fill="#9C4B3B">背叛</text>`;}
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img">${g}${lines}</svg></div>`;
}
function legend(items){return `<div class="legend">${items.map(i=>`<span><i style="background:${i.color}"></i>${i.name}</span>`).join('')}</div>`;}
function selOpts(val){return `<option value=""${val?'':' selected'}>—</option>`+LEVELS.map(l=>`<option ${l===val?'selected':''}>${l}</option>`).join('');}
function grpOpts(val){return `<option value=""${val?'':' selected'}>—</option>`+GROUPNUMS.map(g=>`<option value="${g}" ${String(g)===String(val)?'selected':''}>第${g}組</option>`).join('');}

/* ---------- STUDENT ---------- */
function renderStudent(){

  const myCum=c.rows.map(r=>r.fcum===''?null:(side==='f'?r.fcum:r.ucum));
  const opCum=c.rows.map(r=>r.fcum===''?null:(side==='f'?r.ucum:r.fcum));
  const ratioMy=Math.round(myTot/COOP_MAX*100);
  el.innerHTML=`
  <div class="card">
    <h3>選擇你的組別 <span class="badge">照護量能賽局</span></h3>
    <p class="sub">先選你在哪一個大組、代表 F 還是 U，並勾選你和對手各是第幾組；接著逐回合填選擇，分數自動加權累計。</p>

    </div>

  <div class="card">
    <div class="hero">

      </div>
    </div>
    <div style="margin-top:18px">
      ${lineChart([{name:myG,color:'#2E7D4F',pts:myCum},{name:opG,color:'#B4903A',pts:opCum}],{defect:c.defect})}

  <div class="card">

      <tbody>
      ${c.rows.map((r,i)=>{const myV=side==='f'?r.f:r.u,opV=side==='f'?r.u:r.f;const myPt=(r.f&&r.u)?(side==='f'?r.fp:r.up):'';const myCumV=r.fcum===''?'':(side==='f'?r.fcum:r.ucum);const opCumV=r.fcum===''?'':(side==='f'?r.ucum:r.fcum);
        return `<tr class="${r.w>1?'wt':''}"><td class="rd">${r.n}</td>
          <td><select class="selc s_my" data-i="${i}">${selOpts(myV)}</select></td>

          <td>${myPt===''?'—':myPt}</td><td>×${r.w}${r.w>1?' <span class="wtag">加權</span>':''}</td>
          <td><b style="color:var(--green)">${myCumV===''?'—':myCumV}</b></td>
          <td><b style="color:var(--gold)">${opCumV===''?'—':opCumV}</b></td></tr>`;}).join('')}
      </tbody>
    </table></div>
    <p class="foot-note">提示：手機上點欄位會跳出選單；電腦上點選後可按鍵盤首字快速選。改錯直接重選即可。</p>
  </div>`;
  document.getElementById('s_match').onchange=e=>{ui.match=e.target.value;renderStudent();};
  document.getElementById('s_f').onclick=()=>{ui.side='f';renderStudent();};
  document.getElementById('s_u').onclick=()=>{ui.side='u';renderStudent();};
  document.getElementById('s_mygrp').onchange=e=>{state.groups[mk][side==='f'?'f':'u']=e.target.value;save();renderStudent();};
  document.getElementById('s_opgrp').onchange=e=>{state.groups[mk][side==='f'?'u':'f']=e.target.value;save();renderStudent();};
  el.querySelectorAll('.s_my').forEach(s=>s.onchange=e=>{state.rounds[mk][+e.target.dataset.i][side==='f'?'f':'u']=e.target.value;save();renderStudent();});
  el.querySelectorAll('.s_op').forEach(s=>s.onchange=e=>{state.rounds[mk][+e.target.dataset.i][side==='f'?'u':'f']=e.target.value;save();renderStudent();});
}

  <div class="card">

    ${barChart(cs.map(x=>({name:x.m.label,v:x.c.joint})))}
  </div>
  <div class="matches">
  ${cs.map(({m,c,g})=>{
    const v=verdict(c.ratio,c.played);
    const fG=g.f?('第'+g.f+'組'):'F 隊（待指定）',uG=g.u?('第'+g.u+'組'):'U 隊（待指定）';
    const fCum=c.rows.map(r=>r.fcum===''?null:r.fcum),uCum=c.rows.map(r=>r.ucum===''?null:r.ucum);
    return `<div class="card">

  el.querySelectorAll('.i_f').forEach(s=>s.onchange=e=>{state.rounds[e.target.dataset.m][+e.target.dataset.i].f=e.target.value;save();renderInstructor();});
  el.querySelectorAll('.i_u').forEach(s=>s.onchange=e=>{state.rounds[e.target.dataset.m][+e.target.dataset.i].u=e.target.value;save();renderInstructor();});
}
function barChart(items){
  const W=640,H=180,pad={l:38,r:14,t:14,b:34},max=Math.max(242,...items.map(i=>i.v));
  const bw=(W-pad.l-pad.r)/items.length;let g='';
  [0,.25,.5,.75,1].forEach(t=>{const y=H-pad.b-(H-pad.t-pad.b)*t;g+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#EBE5D5"/><text x="${pad.l-6}" y="${y+4}" font-size="11" fill="#9a9683" text-anchor="end">${Math.round(max*t)}</text>`;});
  const y242=H-pad.b-(H-pad.t-pad.b)*(242/max);g+=`<line x1="${pad.l}" y1="${y242}" x2="${W-pad.r}" y2="${y242}" stroke="#2E7D4F" stroke-dasharray="4 3"/><text x="${W-pad.r}" y="${y242-4}" font-size="10" fill="#2E7D4F" text-anchor="end">全程共好 242</text>`;
  items.forEach((it,i)=>{const h=(H-pad.t-pad.b)*(it.v/max),x=pad.l+bw*i+bw*0.24,w=bw*0.52,yy=H-pad.b-h;
    g+=`<rect x="${x}" y="${yy}" width="${w}" height="${h}" rx="4" fill="var(--green)"/><text x="${x+w/2}" y="${yy-5}" font-size="12" fill="#28281f" text-anchor="middle" font-weight="700">${it.v||''}</text><text x="${x+w/2}" y="${H-12}" font-size="12" fill="#5c5a4e" text-anchor="middle">${it.name}</text>`;});
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">${g}</svg></div>`;
}

function setView(v){ui.view=v;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  ['student','instructor','help'].forEach(k=>document.getElementById('view-'+k).style.display=(k===v?'block':'none'));

}
function renderAll(){if(ui.view==='student')renderStudent();else if(ui.view==='instructor')renderInstructor();else renderHelp();}
